# SWF's state machines and decision logic, written and proved in Lean (models/) and compiled by
# lungo into @swf/models, which runs them as WebAssembly through lungo-ts. The README's "Models"
# section says how they are built and changed.
project = "models"

[lean]
name = "swf-models"
exports = [
  "Swf.Kernel.admits",
  "Swf.Kernel.initial",
  "Swf.Kernel.dispose",
  "Swf.Kernel.idle",
  "Swf.Kernel.gate",
  "Swf.Kernel.commit",
  "Swf.Kernel.travel",
  "Swf.Kernel.canTravel",
  "Swf.Kernel.delivers",
  "Swf.Hierarchy.mayParent",
  "Swf.Hierarchy.nestedMember",
  "Swf.Hierarchy.memberInChain",
  "Swf.Hierarchy.lockRefuses",
  "Swf.Surface.surfaceStep",
  "Swf.Surface.bindGate",
  "Swf.Surface.unbindGate",
  "Swf.Surface.presentGate",
  "Swf.Surface.replaceGate",
  "Swf.Surface.moveGate",
  "Swf.Surface.hideGate",
  "Swf.Surface.hideReleases",
  "Swf.Surface.holdsBinding",
  "Swf.Surface.bindsOnAdapter",
  "Swf.Save.saveOpen",
  "Swf.Save.saveChanged",
  "Swf.Save.saveBegin",
  "Swf.Save.saveEnd",
  "Swf.Migration.migrationPlan",
  "Swf.Fallback.negotiateOne",
  "Swf.Fallback.negotiateFrame",
  "Swf.Fallback.policyIssue",
  "Swf.Fallback.representedModes",
  "Swf.Handoff.handoffStep",
  "Swf.Handoff.validateSurface",
  "Swf.Handoff.swapSurface",
  "Swf.Handoff.settle",
  "Swf.Handoff.settledState",
  "Swf.Handoff.viewportPresents",
  "Swf.Handoff.viewportAdmits",
  "Swf.Handoff.viewportDegraded",
  "Swf.Gesture.pointerRoute",
  "Swf.Gesture.pressRoute",
  "Swf.Gesture.beyondSlop",
  "Swf.Gesture.gestureStep",
  "Swf.Gesture.keyRoute",
  "Swf.Gesture.holdGate",
  "Swf.Arbitration.bestBid",
  "Swf.Arbitration.pickOrder",
  "Swf.ViewMode.transition",
  "Swf.ViewMode.observed",
]

[assurance]
require-claims = ["."]

[ts]
out = "packages/models/program"
options = { embed = "true" }
